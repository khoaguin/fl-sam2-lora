[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "fl-sam2-lora"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
description = "Federated Learning for Medical Image Segmentation using SAM2 with LoRA"
license = "Apache-2.0"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.30.0",
    "peft>=0.5.0",
    "sam2>=1.0.0",
    "open-clip-torch>=3.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "pydicom>=2.4.0",
    "nibabel>=5.0.0",
    "SimpleITK>=2.3.0",
    "syft_flwr>=0.4.3",
]

[tool.uv.sources.syft-flwr]
git = "https://github.com/OpenMined/syft-flwr/"
branch = "main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "OpenMined"

[tool.flwr.app.components]
serverapp = "fl_sam2_lora.server_app:app"
clientapp = "fl_sam2_lora.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
partition-id = 0
num-partitions = 1
min-available-clients = 1
min-fit-clients = 1
min-evaluate-clients = 1
fraction-fit = 1.0
fraction-evaluate = 1.0
# SAM2 specific config
modality = "ct"
target-size = 1024
local-epochs = 10
learning-rate = 0.00005
lora-rank = 32
use-clip = true

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation.options]
num-supernodes = 2
