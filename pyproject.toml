[project]
name = "fl-sam2-lora"
version = "0.1.0"
description = "Federated Learning for Medical Image Segmentation using SAM2 with LoRA"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.30.0",
    "peft>=0.5.0",
    "sam2>=1.0.0",
    "open-clip-torch>=3.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "pydicom>=2.4.0",
    "nibabel>=5.0.0",
    "SimpleITK>=2.3.0",
"ipywidgets>=8.1.7",
    "jupyterlab>=4.5.0",
    "matplotlib>=3.10.0",
    "syft_flwr==0.4.3",
]

[tool.uv.sources.syft-flwr]
git = "https://github.com/OpenMined/syft-flwr/"
branch = "main"
